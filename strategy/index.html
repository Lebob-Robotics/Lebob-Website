<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1b1e">
<title>Strategy · Lebob</title>
<meta name="description" content="Lebob's scouting numbers for every Australian FTC BIOBUZZ team: expected points, tips and match video.">
<link rel="canonical" href="https://lebob.com.au/strategy/">
<link rel="icon" href="lebob-mark-primary.svg" type="image/svg+xml">
<link rel="preload" href="fonts/ibm-plex-sans-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>try{var t=JSON.parse(localStorage.getItem("lbs:theme"));if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:400 700;font-display:swap;src:url('fonts/ibm-plex-sans-var-latin.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/ibm-plex-mono-400-latin.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/ibm-plex-mono-500-latin.woff2') format('woff2')}
/* lebob.com.au site tokens, matching /scout. Red fills shapes and never sets body text on dark. Blue is the BLUE alliance, not brand. */
:root{--bg:#1a1b1e;--panel:#242529;--panel2:#1f2024;--hover:#28292e;--line:#36373c;--fg:#c8c9c2;--fg-dark:#e5e6e0;--muted:#8a8b83;--accent:#FFF200;--accent-ink:#1a1b1e;--label:#FFF200;--focus:#FFF200;--red:#ED1C24;--blue:#2F7DF6;--ok:#3DCB6C;--warn:#F5A524;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f4f0;--panel:#ffffff;--panel2:#f4f4f0;--hover:#ebebe6;--line:#d6d6cf;--fg:#2a2b2f;--fg-dark:#1a1b1e;--muted:#5f605a;--label:#1a1b1e;--focus:#1a1b1e}}
:root[data-theme="light"]{--bg:#f4f4f0;--panel:#ffffff;--panel2:#f4f4f0;--hover:#ebebe6;--line:#d6d6cf;--fg:#2a2b2f;--fg-dark:#1a1b1e;--muted:#5f605a;--label:#1a1b1e;--focus:#1a1b1e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 'IBM Plex Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
a{color:var(--fg-dark);text-decoration-color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg-dark);text-decoration:none;font-weight:700;font-size:18px}
.brand img{width:32px;height:33px;opacity:1}
.hdrmeta{margin-left:auto;font:13px var(--mono);color:var(--muted)}
.thbtn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;min-width:38px;min-height:38px;font-size:17px;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav a{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:8px 16px;font-size:15px;text-decoration:none}
nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
main{padding:16px 16px 80px;max-width:1100px;margin:0 auto}
h1{font-size:28px;line-height:1.2;letter-spacing:-.02em;color:var(--fg-dark);margin:8px 0 6px}
h2{font:500 13px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--label);margin:28px 0 10px}
p.lead{max-width:64ch;color:var(--fg);margin:0 0 16px}
.muted{color:var(--muted)}.small{font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font:600 30px/1.1 'IBM Plex Sans',sans-serif;color:var(--fg-dark);font-variant-numeric:tabular-nums}
.stat .k{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.stat .s{font-size:13px;color:var(--muted);margin-top:4px}
.stat.hl{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
input,select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px}
input[type=search]{min-width:220px;flex:1 1 220px}
label.chk{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--fg)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--panel2);position:sticky;top:0;cursor:pointer;user-select:none}
th[aria-sort]::after{content:" ↓";color:var(--label)}th[aria-sort="ascending"]::after{content:" ↑"}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--hover)}
tr.me td{background:var(--accent-light,rgba(255,242,0,.08))}tr.me td:first-child{box-shadow:inset 4px 0 0 var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.badge{display:inline-block;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:2px;margin-left:6px}
.badge.y{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.al{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.al.red{background:var(--red)}.al.blue{background:var(--blue)}
.range{position:relative;height:8px;border-radius:4px;background:var(--panel2);width:140px;display:inline-block;vertical-align:middle;margin-left:8px}
.range i{position:absolute;top:0;bottom:0;border-radius:4px;background:color-mix(in srgb,var(--accent) 35%,transparent)}
.range b{position:absolute;top:-3px;width:3px;height:14px;border-radius:2px;background:var(--accent)}
:root[data-theme="light"] .range b{background:var(--fg-dark)}:root[data-theme="light"] .range i{background:#c9c9c0}
.split{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin:6px 0}
.split div{display:flex;align-items:center;justify-content:center;font:600 14px var(--mono);color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.split .a{background:color-mix(in srgb,var(--red) 75%,#000)}.split .b{background:color-mix(in srgb,var(--red) 40%,var(--panel2));color:var(--fg-dark)}
.split.blue .a{background:color-mix(in srgb,var(--blue) 75%,#000)}.split.blue .b{background:color-mix(in srgb,var(--blue) 35%,var(--panel2))}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.grid2>div{min-width:0}
.card table td{white-space:normal}@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.video{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.note{border-left:4px solid var(--accent);background:var(--panel);padding:10px 14px;border-radius:0 10px 10px 0;margin:12px 0;max-width:80ch}
.note.warn{border-color:var(--warn)}
ul.plain{padding-left:18px;max-width:72ch}ul.plain li{margin:4px 0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.back{margin:4px 0 8px}
footer{margin-top:40px;padding:28px 16px 32px;background-image:repeating-linear-gradient(90deg,var(--accent) 0 8px,transparent 8px 16px);background-size:100% 8px;background-repeat:no-repeat;font:13px var(--mono);color:var(--muted);text-align:center}
@media (max-width:600px){.hm,.range{display:none}td,th{white-space:normal}h1{font-size:23px}.hdrmeta{display:none}th,td{padding:8px 7px;font-size:14px}.range{width:70px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <a class="brand" href="#rankings"><img src="lebob-mark-primary.svg" alt="" width="88" height="90" decoding="async"><span>Lebob Strategy</span></a>
  <span class="hdrmeta" id="hdrMeta"></span>
  <button type="button" class="thbtn" id="thBtn" aria-label="Switch light or dark mode"></button>
</header>
<nav id="tabs" aria-label="Sections">
  <a href="#rankings" data-r="rankings">Rankings</a>
  <a href="#lebob" data-r="lebob">Lebob</a>
  <a href="#matches" data-r="matches">Matches</a>
  <a href="#events" data-r="events">Events</a>
  <a href="#how" data-r="how">How it works</a>
</nav>
<main id="app"></main>
<footer>LEBOB STRATEGY · FTC TEAM 29550 · <span id="ftGen"></span></footer>
<script src="data.js"></script>
<script>
"use strict";
const D = window.STRATEGY;
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = v => v == null ? '' : String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1 = v => v == null || Number.isNaN(v) ? '–' : (Math.round(v * 10) / 10).toFixed(1);
const f0 = v => v == null ? '–' : String(Math.round(v));
const T = D.teamIdx;
const tname = n => T[n] ? T[n].name : '';
const tlink = n => `<a href="#team/${n}">${n}</a>`;
const stageName = m => m.stage === 'Q' ? `Qual ${m.number}` : `Playoff ${m.series || m.number}`;
const yt = (id, t, auto) => `https://www.youtube-nocookie.com/embed/${id}?start=${Math.max(0, Math.floor(t))}${auto ? '&autoplay=1' : ''}&rel=0`;
const ytOpen = (id, t) => `https://www.youtube.com/watch?v=${id}&t=${Math.max(0, Math.floor(t))}s`;

// Theme toggle (same storage key as /scout so the choice carries across)
const thBtn = $('#thBtn');
function setThIcon(){ const d = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); thBtn.textContent = d === 'light' ? '☾' : '☀'; }
thBtn.onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); const nx = cur === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = nx; localStorage.setItem('lbs:theme', JSON.stringify(nx)); setThIcon(); };
setThIcon();
$('#hdrMeta').textContent = `BIOBUZZ 2026 · Australia · data ${D.generatedDate}`;
$('#ftGen').textContent = `Built ${D.generated} from official FIRST results and public match video`;

function rangeBar(v, lo, hi, max){
  if (v == null || lo == null || hi == null) return '';
  const p = x => Math.max(0, Math.min(100, 100 * x / max));
  return `<span class="range" aria-hidden="true"><i style="left:${p(lo)}%;width:${p(hi) - p(lo)}%"></i><b style="left:calc(${p(v)}% - 1px)"></b></span>`;
}
function sortable(table){
  const ths = table.tHead.rows[0].cells;
  [...ths].forEach((th, i) => th.onclick = () => {
    const asc = th.getAttribute('aria-sort') === 'descending';
    [...ths].forEach(x => x.removeAttribute('aria-sort'));
    th.setAttribute('aria-sort', asc ? 'ascending' : 'descending');
    const rows = [...table.tBodies[0].rows];
    rows.sort((a, b) => { const x = a.cells[i].dataset.v ?? a.cells[i].innerText, y = b.cells[i].dataset.v ?? b.cells[i].innerText; const nx = parseFloat(x), ny = parseFloat(y); const c = !isNaN(nx) && !isNaN(ny) ? nx - ny : x.localeCompare(y); return asc ? c : -c; });
    rows.forEach(r => table.tBodies[0].appendChild(r));
  });
}
function rowLinks(root){ root.querySelectorAll('tr[data-href]').forEach(tr => tr.onclick = e => { if (e.target.closest('a')) return; location.hash = tr.dataset.href; }); }

// ---------- Rankings
function viewRankings(){
  const st = D.states;
  app.innerHTML = `
  <h1>Who scores the most</h1>
  <p class="lead">Every Australian team ranked by the points it adds to its alliance in an average match. Click a team to see its matches and video.</p>
  <div class="controls">
    <input type="search" id="q" placeholder="Search team number or name" aria-label="Search teams">
    <select id="st" aria-label="State"><option value="">All states</option>${st.map(s => `<option>${s}</option>`).join('')}</select>
    <label class="chk"><input type="checkbox" id="played" checked> Only teams that have played</label>
  </div>
  <div class="tablewrap"><table id="rt"><thead><tr>
    <th class="n">#</th><th>Team</th><th class="hm">State</th>
    <th class="n" aria-sort="descending" title="Expected points this robot adds per match">Points / match</th>
    <th class="n" title="HIVE tips per match (20 points each)">Tips / match</th>
    <th class="n hm" title="Official LEAVE and PARK points, recorded per robot">Leave + park</th>
    <th class="n hm">Matches</th><th class="n hm">Video</th>
  </tr></thead><tbody></tbody></table></div>
  <p class="small muted">Points / match: the bar shows the likely range (10th to 90th percentile). Lebob is rated from its final playoff match only. <a href="#how">How these numbers work</a>.</p>`;
  const max = Math.max(...D.teams.map(t => t.pts_hi || 0));
  const draw = () => {
    const q = $('#q').value.trim().toLowerCase(), s = $('#st').value, pl = $('#played').checked;
    const rows = D.teams.filter(t => (!q || String(t.number).includes(q) || (t.name || '').toLowerCase().includes(q)) && (!s || t.state === s) && (!pl || t.matches > 0));
    $('#rt tbody').innerHTML = rows.map(t => `<tr data-href="team/${t.number}" class="${t.number === D.target ? 'me' : ''}">
      <td class="n num">${t.rank ?? '–'}</td>
      <td>${tlink(t.number)} ${esc(t.name)}${t.number === D.target ? `<span class="badge y">${esc(t.source || 'final match')}</span>` : ''}</td>
      <td class="hm">${esc(t.state)}</td>
      <td class="n" data-v="${t.pts ?? -1}"><span class="num">${f1(t.pts)}</span>${rangeBar(t.pts, t.pts_lo, t.pts_hi, max)}</td>
      <td class="n num" data-v="${t.tips ?? -1}">${f1(t.tips)}</td>
      <td class="n num hm" data-v="${t.leave_park ?? -1}">${f1(t.leave_park)}</td>
      <td class="n num hm">${t.matches}</td>
      <td class="n num hm">${t.video}</td></tr>`).join('');
    rowLinks($('#rt'));
  };
  ['q', 'st', 'played'].forEach(id => $('#' + id).oninput = draw);
  draw(); sortable($('#rt'));
}

// ---------- Team
function matchRow(m, n){
  const mine = m.robots.find(r => r.team === n), partner = m.robots.find(r => r.alliance === mine.alliance && r.team !== n);
  const opp = mine.alliance === 'red' ? m.blue : m.red, own = mine.alliance === 'red' ? m.red : m.blue;
  const res = own.score > opp.score ? 'Won' : own.score < opp.score ? 'Lost' : 'Tie';
  return `<tr data-href="match/${m.key}"><td>${esc(m.event)} ${stageName(m)}</td><td><span class="al ${mine.alliance}"></span>${partner ? tlink(partner.team) : '–'}</td>
    <td>${res} <span class="num">${own.score}–${opp.score}</span></td><td class="n num">${own.tips}</td>
    <td class="n" data-v="${mine.pts}"><span class="num">${f1(mine.pts)}</span></td><td class="n num">${f0(mine.low)}–${f0(mine.high)}</td>
    <td class="n num">${mine.leave + mine.auto_park + mine.dc_park}</td><td>${m.video ? `<a href="#match/${m.key}">watch</a>` : '<span class="muted">none</span>'}</td></tr>`;
}
function viewTeam(n){
  const t = T[n];
  if (!t) { app.innerHTML = `<p>No team ${esc(n)}.</p>`; return; }
  const ms = D.matches.filter(m => m.robots.some(r => r.team === n));
  const isMe = n === D.target;
  app.innerHTML = `<p class="back"><a href="#rankings">← Rankings</a></p>
  <h1>${n} ${esc(t.name)}</h1>
  <p class="lead">${esc(t.city)}${t.city ? ', ' : ''}${esc(t.state)} · ${t.events.map(e => esc(e)).join(', ') || 'no events yet'}${t.awards.length ? ' · ' + t.awards.map(esc).join('; ') : ''}</p>
  <div class="stats">
    <div class="stat hl"><div class="k">Points / match</div><div class="v">${f1(t.pts)}</div><div class="s">likely ${f1(t.pts_lo)} to ${f1(t.pts_hi)}${t.rank ? ` · rank ${t.rank} of ${D.rankedCount}` : ''}</div></div>
    <div class="stat"><div class="k">Tips / match</div><div class="v">${f1(t.tips)}</div><div class="s">${f1(t.tips_lo)} to ${f1(t.tips_hi)} · 20 points each</div></div>
    <div class="stat"><div class="k">Leave + park</div><div class="v">${f1(t.leave_park)}</div><div class="s">official, per robot, per match</div></div>
    <div class="stat"><div class="k">Other points</div><div class="v">${f1(t.other)}</div><div class="s">pollen in hive and garden, flowers</div></div>
  </div>
  ${isMe ? `<div class="note">Lebob's rating uses its final playoff match only. <a href="#lebob">See the breakdown</a>.</div>` : ''}
  ${t.video_tips ? `<p class="small">Tips credited from match video: <b>${+t.video_tips.toFixed(2)}</b> (a tip shared by both robots is split by each robot's traced launches).</p>` : ''}
  <h2>Matches</h2>
  ${ms.length ? `<div class="tablewrap"><table id="tm"><thead><tr><th>Match</th><th>Partner</th><th>Result</th><th class="n">Alliance tips</th><th class="n">Robot points</th><th class="n">Possible range</th><th class="n">Leave + park</th><th>Video</th></tr></thead><tbody>${ms.map(m => matchRow(m, n)).join('')}</tbody></table></div>
  <p class="small muted">Robot points split the alliance score between the two robots so they add up to the official score. The range runs from what this robot certainly scored to everything its partner did not certainly score.</p>` : '<p class="muted">No matches played this season yet.</p>'}`;
  if (ms.length) { sortable($('#tm')); rowLinks($('#tm')); }
}

// ---------- Match
function allianceBlock(m, col){
  const a = m[col], rs = m.robots.filter(r => r.alliance === col);
  const tot = a.score || 1;
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b><span class="al ${col}"></span>${col === 'red' ? 'Red' : 'Blue'}</b><span class="num" style="font-size:26px;color:var(--fg-dark)">${a.score}</span></div>
  <div class="small muted">${a.tips} tips · AUTO ${a.auto} · TELEOP ${a.dc}${a.pen ? ` · ${a.pen} penalty points` : ''}</div>
  <div class="split ${col === 'blue' ? 'blue' : ''}">${rs.map((r, i) => `<div class="${i ? 'b' : 'a'}" style="width:${100 * Math.max(0, r.pts) / tot}%" title="${r.team}: ${f1(r.pts)}">${r.team} · ${f0(r.pts)}</div>`).join('')}</div>
  <table><tbody>${rs.map(r => `<tr data-href="team/${r.team}"><td>${tlink(r.team)} ${esc(tname(r.team))}</td><td class="n num">${f1(r.pts)}</td><td class="n small muted">${f0(r.low)}–${f0(r.high)}</td><td class="n small">${r.tips_video ? `${+r.tips_video.toFixed(2)} tip${r.tips_video !== 1 ? 's' : ''} on video` : `~${f1(r.tips)} tips`}</td></tr>`).join('')}</tbody></table></div>`;
}
function viewMatch(key){
  const m = D.matchIdx[key];
  if (!m) { app.innerHTML = `<p>No match ${esc(key)}.</p>`; return; }
  const v = m.video;
  app.innerHTML = `<p class="back"><a href="#matches">← Matches</a></p>
  <h1>${esc(m.eventName)} · ${stageName(m)}</h1>
  <p class="lead">${esc(m.event)}${m.time ? ' · ' + esc(m.time) : ''}</p>
  <div class="grid2">
    <div>${v ? `<div class="video"><iframe id="mv" src="${yt(v.id, v.auto)}" title="Match video" allow="encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
      <p class="small"><a href="${ytOpen(v.id, v.auto)}" target="_blank" rel="noopener">Open on YouTube</a> · starts at AUTO</p>
      ${m.tips.length ? `<h2>Tips in this match</h2><div class="tablewrap"><table><thead><tr><th>Time</th><th>Alliance</th><th>Score</th><th>Robot</th></tr></thead><tbody>${m.tips.map(t => `<tr><td><a href="#" data-seek="${t.t}">${t.clock}</a></td><td><span class="al ${t.alliance}"></span>${t.alliance}</td><td class="num">${t.from} → ${t.to}</td><td>${t.team ? tlink(t.team) : `<span class="muted">${esc(t.status)}</span>`}</td></tr>`).join('')}</tbody></table></div>` : ''}`
      : '<div class="card muted">No public video found for this match.</div>'}</div>
    <div>${allianceBlock(m, 'red')}${allianceBlock(m, 'blue')}
      <p class="small muted">Leave and park points come from the referee's per-robot record. The rest of each alliance's score is split by how much each robot usually scores.</p></div>
  </div>`;
  app.querySelectorAll('[data-seek]').forEach(a => a.onclick = e => { e.preventDefault(); $('#mv').src = yt(v.id, +a.dataset.seek - 3, true); });
  rowLinks(app);
}
function viewMatches(){
  const evs = D.events.filter(e => e.played > 0);
  app.innerHTML = `<h1>Matches</h1><p class="lead">Every played match, with the video where we found it. Click a match to watch it and see how the points split between robots.</p>
  <div class="controls"><select id="me" aria-label="Event"><option value="">All events</option>${evs.map(e => `<option value="${e.key}">${esc(e.name)}</option>`).join('')}</select>
  <input type="search" id="mt" placeholder="Team number" aria-label="Team number" inputmode="numeric">
  <label class="chk"><input type="checkbox" id="mv"> With video only</label></div>
  <div class="tablewrap"><table id="mtab"><thead><tr><th>Event</th><th>Match</th><th>Red</th><th class="n">Red</th><th class="n">Blue</th><th>Blue</th><th>Video</th></tr></thead><tbody></tbody></table></div>`;
  const draw = () => {
    const e = $('#me').value, t = $('#mt').value.trim(), v = $('#mv').checked;
    const rows = D.matches.filter(m => (!e || m.eventKey === e) && (!t || m.robots.some(r => String(r.team) === t)) && (!v || m.video));
    const side = (m, c) => m.robots.filter(r => r.alliance === c).map(r => r.team === D.target ? `<b>${r.team}</b>` : r.team).join(' + ');
    $('#mtab tbody').innerHTML = rows.map(m => `<tr data-href="match/${m.key}"><td>${esc(m.event)}</td><td>${stageName(m)}</td><td><span class="al red"></span>${side(m, 'red')}</td>
      <td class="n num" ${m.red.score > m.blue.score ? 'style="font-weight:700;color:var(--fg-dark)"' : ''}>${m.red.score}</td><td class="n num" ${m.blue.score > m.red.score ? 'style="font-weight:700;color:var(--fg-dark)"' : ''}>${m.blue.score}</td>
      <td><span class="al blue"></span>${side(m, 'blue')}</td><td>${m.video ? 'watch' : '<span class="muted">–</span>'}</td></tr>`).join('');
    rowLinks($('#mtab'));
  };
  ['me', 'mt', 'mv'].forEach(id => $('#' + id).oninput = draw);
  draw();
}
function viewEvents(){
  app.innerHTML = `<h1>Events</h1><p class="lead">Australian BIOBUZZ events this season and how much of each we could watch.</p>
  <div class="tablewrap"><table id="et"><thead><tr><th>Date</th><th>Event</th><th>State</th><th class="n">Teams</th><th class="n">Matches</th><th class="n">With video</th><th>Links</th></tr></thead><tbody>
  ${D.events.map(e => `<tr data-href="matches"><td class="num">${esc(e.date)}</td><td>${esc(e.name)}</td><td>${esc(e.state)}</td><td class="n num">${e.teams}</td><td class="n num">${e.played || '–'}</td><td class="n num">${e.played ? e.video : '–'}</td>
  <td><a href="${e.ftcscout}" target="_blank" rel="noopener">FTCScout</a> · <a href="${e.first}" target="_blank" rel="noopener">FIRST</a></td></tr>`).join('')}</tbody></table></div>`;
  sortable($('#et'));
}

// ---------- Lebob
function viewLebob(){
  const L = D.lebob, t = T[D.target];
  const r = L.final, A = L.account;
  app.innerHTML = `<h1>Lebob · ${L.finalLabel}</h1>
  <p class="lead">Lebob's rating uses its last playoff match only. The robot was broken for most of qualifications, so those matches undersell it.</p>
  <div class="stats">
    ${A ? `<div class="stat hl"><div class="k">Lebob rating · team account</div><div class="v">${f0(A.rating)}</div><div class="s">${A.tips} of ${r.alliance_tips} tips + park, ${f0(A.rating_low)} to ${f0(A.rating_high)}</div></div>
    <div class="stat"><div class="k">Video and data only</div><div class="v">${f0(r.rating)}</div><div class="s">if ${esc(tname(r.partner))} scored its usual, ${f0(r.rating_low)} to ${f0(r.rating_high)}</div></div>`
    : `<div class="stat hl"><div class="k">Lebob rating</div><div class="v">${f0(r.rating)}</div><div class="s">points in ${L.finalShort}, likely ${f0(r.rating_low)} to ${f0(r.rating_high)}</div></div>`}
    <div class="stat"><div class="k">Alliance score</div><div class="v">${f0(r.alliance_np)}</div><div class="s">with ${r.partner} ${esc(tname(r.partner))}, ${r.alliance_tips} tips</div></div>
    <div class="stat"><div class="k">Certain</div><div class="v">${f0(r.own_certain)}</div><div class="s">official park points${r.video_tips && r.video_tips[D.target] ? ' and tips on video' : ''}</div></div>
    <div class="stat"><div class="k">Most possible</div><div class="v">${f0(r.max_possible)}</div><div class="s">if ${esc(tname(r.partner))} scored nothing</div></div>
  </div>
  ${A ? `<div class="card"><b>How the ${f0(A.rating)} is worked out</b>
  <p>${esc(A.statement)}</p>
  <p>That gives Lebob ${A.tips} tips × 20 = ${A.tips * 20}, plus its ${f0(r.own_certain)} official park points, plus about half of the alliance's other ${f0(A.rating_high - A.rating_low)} points (garden and pollen, which we can't split): <b>${f0(A.rating)}</b>.</p>
  <p class="small muted">This is the drive team's account, not something the match video proves. The broadcast camera can't show which robot made each tip. It does show Hive Tide stuck at the back wall early on and not moving for the last 30 seconds.</p></div>` : ''}
  <div class="card"><b>${A ? 'Without the team account' : `How the ${f0(r.rating)} is worked out`}</b>
  <p>The alliance scored ${f0(r.alliance_np)}. In its other matches this season, ${esc(tname(r.partner))} scored about ${f0(r.partner_expected_scoring)} points a match (likely ${f0(r.partner_expected_low)} to ${f0(r.partner_expected_high)}). If it played normally in ${L.finalShort}, Lebob scored the rest: ${f0(r.alliance_np)} − ${f0(r.partner_expected_scoring)} ≈ <b>${f0(r.rating)}</b>.</p>
  <p>If ${esc(tname(r.partner))} scored less than usual, Lebob scored more.${A ? '' : ` The team remembers Lebob at about ${L.teamClaim} points, which needs ${esc(tname(r.partner))} to have scored about ${f0(r.alliance_np - L.teamClaim)}, much less than its usual ${f0(r.partner_expected_scoring)}.`}</p></div>
  <h2>All three playoff matches, same method</h2>
  <div class="tablewrap"><table><thead><tr><th>Match</th><th>Partner</th><th class="n">Alliance</th><th class="n">Lebob</th><th class="n">Likely range</th><th></th></tr></thead><tbody>
  ${L.playoffs.map(p => `<tr data-href="match/${p.match_key}"><td>${esc(p.label)}</td><td>${tlink(p.partner)} ${esc(tname(p.partner))}</td><td class="n num">${f0(p.alliance_np)}</td><td class="n num"><b>${f0(p.rating)}</b></td><td class="n num">${f0(p.rating_low)}–${f0(p.rating_high)}</td><td><a href="#match/${p.match_key}">watch</a></td></tr>`).join('')}
  </tbody></table></div>
  <h2>What the video shows in ${L.finalShort}</h2>
  <ul class="plain">${L.videoFindings.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
  <h2>For comparison</h2>
  <p class="small">Qualification OPR at the WA Qualifier: <span class="num">${f1(L.qualOpr)}</span> (Lebob was broken for most of these). Season model across all matches: <span class="num">${f1(L.seasonModel)}</span> points a match.</p>`;
  rowLinks(app);
}

function viewHow(){
  app.innerHTML = `<h1>How it works</h1>
  <p class="lead">Every number comes from official FIRST match results and public match video. Nothing here is paid for or guessed by hand.</p>
  <div class="card"><b>Points / match</b><p>Each match gives two alliance scores. A robot's own points are hidden inside its alliance's score. We solve for them across every Australian match this season, so each team's estimate draws on every partner and opponent it played with. Robots with few matches are pulled towards the average until more matches show otherwise.</p>
  <p>We split each score into three parts and work them out separately:</p>
  <ul class="plain"><li><b>Leave + park</b>: the referees record these per robot, so they need no estimating.</li><li><b>Tips</b>: HIVE tips, worth 20 points each. Where the video clearly shows which robot made a tip, that tip is credited directly.</li><li><b>Other points</b>: pollen left in the HIVE and garden, and flowers.</li></ul>
  <p>The likely range comes from re-running the calculation many times on shuffled sets of matches. A wide range means the team has few matches or very up-and-down results.</p></div>
  <div class="card"><b>Robot points in one match</b><p>For a single match, we split the alliance score between the two robots in proportion to how much each usually scores. The split always adds up to the official score. The possible range runs from what the robot certainly scored (its own leave and park, plus tips seen on video) to everything its partner did not certainly score.</p></div>
  <div class="card"><b>Video</b><p>We found public video for ${D.coverage.withVideo} of ${D.coverage.played} played matches, lined each one up with the official match timing, and read the on-screen scoreboard to time every tip. A GPU pass reads robot numberplates to tell the robots apart. Tips are only credited to a robot when the video shows it clearly. The rest stay shared.</p></div>
  <div class="card"><b>Lebob</b><p>Lebob is rated on its final playoff match because the robot was broken for most of qualifications. Where the drive team has said which robot made each tip, the rating uses that and is labelled "team account". Otherwise it takes the alliance score and subtracts what the partner usually scores.</p></div>
  <p class="small muted">Data: official results via FTCScout and FIRST. Built ${esc(D.generated)}.</p>`;
}

// ---------- Router
function route(){
  const h = decodeURIComponent(location.hash.slice(1)) || 'rankings';
  const [r, arg] = h.split('/');
  document.querySelectorAll('#tabs a').forEach(a => a.toggleAttribute('aria-current', a.dataset.r === r || (r === 'team' && a.dataset.r === 'rankings') || (r === 'match' && a.dataset.r === 'matches')));
  document.querySelectorAll('#tabs a[aria-current]').forEach(a => a.setAttribute('aria-current', 'page'));
  if (r === 'team') viewTeam(+arg);
  else if (r === 'match') viewMatch(arg);
  else if (r === 'matches') viewMatches();
  else if (r === 'events') viewEvents();
  else if (r === 'lebob') viewLebob();
  else if (r === 'how') viewHow();
  else viewRankings();
  const titles = {team: `${arg} ${tname(+arg)}`, match: 'Match', matches: 'Matches', events: 'Events', lebob: 'Lebob', how: 'How it works'};
  document.title = `${titles[r] ? titles[r] + ' · ' : ''}Strategy · Lebob`;
  if (!h.startsWith('rankings')) window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>
