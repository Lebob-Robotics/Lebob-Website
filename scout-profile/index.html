<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lebob Scout</title>
<meta http-equiv="refresh" content="0; url=/scout/">
<link rel="canonical" href="/scout/">
<style>body{font-family:system-ui,sans-serif;background:#1a1b1e;color:#eee;padding:24px}a{color:#fff}</style>
</head>
<body>
<p>The scout app has moved to <a href="/scout/">lebob.com.au/scout</a>.</p>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (r.scope.endsWith('/scout-profile/')) r.unregister(); }));
location.replace('/scout/');
</script>
</body>
</html>
